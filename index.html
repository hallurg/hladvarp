<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hlaðvarp Studio</title>
<style>
:root{--brand:#c40046;--brand-dark:#960035;--ink:#151515;--muted:#5d6470;--line:#dedede;--surface:#f6f6f4;--panel:#fff;--soft:#f6f6f4;--shadow:0 8px 18px rgba(0,0,0,.06)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--soft);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.58}.shell{max-width:1440px;margin:0 auto;padding:0 28px 28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:0 -28px 24px;padding:18px 28px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:18px}.logo{width:72px;height:72px;object-fit:contain}.tagline,.muted{color:var(--muted)}h1{font-size:clamp(1.5rem,3vw,2rem);margin:0}.status{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.pill,.status span{display:inline-flex;align-items:center;min-height:30px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);padding:5px 10px;font-size:.86rem}.banner,.panel,.timer,.controls{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.banner{display:flex;justify-content:space-between;gap:18px;margin-bottom:18px;padding:16px 18px}.eyebrow{margin:0 0 8px;color:var(--brand-dark);font-size:.78rem;font-weight:700;text-transform:uppercase}.grid{display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);gap:22px}.side,.main{display:grid;gap:18px}.panel{padding:18px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h2{margin:0;font-size:1rem}label{display:block;margin:14px 0 6px;color:var(--muted);font-size:.9rem;font-weight:700}input,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:11px 12px;outline:none}textarea{min-height:180px;resize:vertical;line-height:1.45}input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(196,0,70,.14)}.btn,.icon{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid transparent;border-radius:6px;padding:9px 13px;font-weight:700;text-decoration:none;white-space:nowrap}.primary,.danger{background:var(--brand);color:#fff}.primary:hover,.danger:hover{background:var(--brand-dark)}.secondary{border-color:var(--line);background:#fff;color:var(--ink)}.secondary:hover{background:var(--soft)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.meter{display:grid;grid-template-columns:repeat(6,1fr);align-items:end;gap:7px;height:72px;margin-bottom:16px;padding:14px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,#fff,#f2f2ef)}.meter span{height:22%;border-radius:999px 999px 3px 3px;background:var(--brand);opacity:.65}.recording .meter span{animation:meter 900ms ease-in-out infinite}.recording .meter span:nth-child(2){animation-delay:90ms}.recording .meter span:nth-child(3){animation-delay:180ms}.recording .meter span:nth-child(4){animation-delay:270ms}.recording .meter span:nth-child(5){animation-delay:360ms}.recording .meter span:nth-child(6){animation-delay:450ms}@keyframes meter{50%{height:86%}}audio{width:100%;margin-top:14px}.timer{display:grid;grid-template-columns:minmax(190px,1fr) minmax(170px,260px) minmax(170px,260px);gap:14px;padding:22px}.timebox{display:grid;align-content:center;min-height:120px;border:1px solid var(--line);border-radius:8px;background:#fafafa;padding:18px}.timebox strong{font-size:clamp(2.1rem,6vw,4.7rem);line-height:.95;font-variant-numeric:tabular-nums}.progress{height:12px;border:1px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),#b7791f);transition:width .2s}.controls{padding:14px}.sections{display:grid;gap:10px}.section{display:grid;grid-template-columns:minmax(170px,1fr) 96px 130px 42px;gap:10px;align-items:end;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px}.section.active{border-color:var(--brand);box-shadow:0 0 0 4px rgba(196,0,70,.12)}.ad{display:flex;align-items:center;gap:8px;min-height:42px;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:8px 10px;color:var(--ink)}.ad input{width:18px;height:18px;accent-color:var(--brand)}.delete{width:42px;height:42px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--brand);font-size:1.35rem}.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:36px;margin-top:14px}.chip{border-radius:999px;background:rgba(196,0,70,.08);color:var(--brand-dark);padding:7px 10px;font-size:.86rem;font-weight:700}.log{display:grid;gap:8px;max-height:240px;margin:0;padding-left:22px;overflow:auto}.log li{border-left:4px solid var(--brand);border-radius:4px;background:#fff;padding:9px 10px}.log li.warning{border-left-color:#b7791f}.log li.danger{border-left-color:var(--brand)}@media(max-width:1080px){.grid,.timer{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{padding:0 18px 18px}.topbar{align-items:flex-start;flex-direction:column;margin:0 -18px 18px;padding:18px}.logo{width:58px;height:58px}.side{grid-template-columns:1fr}.section{grid-template-columns:1fr}.delete{width:100%}.banner{flex-direction:column}.btn{flex:1 1 auto}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><img class="logo" src="https://hladvarp.com/logo.jpg" alt="Hlaðvarp.com"><div><h1>Hlaðvarp Studio</h1><div class="tagline">Tímasett handrit og upptaka</div></div></div><div class="status" aria-live="polite"><span id="clockStatus">Klukka: stopp</span><span id="recordingStatus">Upptaka: tilbúin</span></div></header>
<section id="integrationBanner" class="banner" hidden><div><p class="eyebrow">Tengt við Hlaðvarp.com</p><h2 id="integrationSummary">Nýr þáttur</h2><p id="integrationDetails" class="muted"></p></div><a id="returnToHladvarp" class="btn secondary" hidden>Til baka</a></section>
<main class="grid"><aside class="side"><section class="panel"><div class="heading"><h2>Heild</h2><span id="durationDelta" class="pill">0 mín</span></div><label for="totalMinutes">Heildartími í mínútum</label><input id="totalMinutes" type="number" min="1" step="1" value="45"><label for="scriptInput">Handrit eða punktar</label><textarea id="scriptInput">Opnun þáttar og kynning. Ræðum helstu fréttir vikunnar, tæknibreytingar, samfélagsmál og viðtal við gest. Auglýsing kemur eftir fyrsta kafla. Síðan förum við í spurningar frá hlustendum og lokum með samantekt.</textarea><button id="analyzeTopics" class="btn secondary" type="button">Greina málefni</button><div id="topicResults" class="chips" aria-live="polite"></div></section><section class="panel"><div class="heading"><h2>Upptaka</h2><span id="recordingTimer" class="pill">00:00:00</span></div><div class="meter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="row"><button id="recordButton" class="btn danger" type="button">Taka upp</button><button id="pauseRecordButton" class="btn secondary" type="button" disabled>Pása</button><button id="stopRecordButton" class="btn secondary" type="button" disabled>Stöðva</button></div><audio id="recordingPlayback" controls hidden></audio><div class="row" style="margin-top:12px"><button id="sendRecording" class="btn secondary" type="button" hidden disabled>Senda inn</button><a id="downloadRecording" class="btn secondary" hidden>Niðurhala upptöku</a></div></section></aside><section class="main"><div class="timer"><div><p class="eyebrow">Núverandi kafli</p><h2 id="activeSectionTitle">Opnun</h2></div><div class="timebox"><span class="muted">Kafli</span><strong id="sectionCountdown">10:00</strong></div><div class="timebox"><span class="muted">Heild</span><strong id="totalCountdown">45:00</strong></div></div><div class="progress" aria-hidden="true"><div id="totalProgress"></div></div><div class="controls row"><button id="startClock" class="btn primary" type="button">Byrja</button><button id="pauseClock" class="btn secondary" type="button" disabled>Pása</button><button id="nextSection" class="btn secondary" type="button">Næsti kafli</button><button id="resetClock" class="btn secondary" type="button">Endurstilla</button><button id="enableNotifications" class="btn secondary" type="button">Virkja tilkynningar</button></div><section class="panel"><div class="heading"><h2>Kaflar</h2><button id="addSection" class="btn secondary" type="button">Bæta við</button></div><div id="sectionList" class="sections"></div></section><section class="panel"><div class="heading"><h2>Áminningar</h2><span class="pill">5 mín + auglýsingar</span></div><ol id="alertLog" class="log" aria-live="polite"></ol></section></section></main>
</div>
<script>
const $=s=>document.querySelector(s);const e={total:$('#totalMinutes'),delta:$('#durationDelta'),script:$('#scriptInput'),topics:$('#topicResults'),record:$('#recordButton'),pauseRecord:$('#pauseRecordButton'),stopRecord:$('#stopRecordButton'),recordTimer:$('#recordingTimer'),recordStatus:$('#recordingStatus'),playback:$('#recordingPlayback'),download:$('#downloadRecording'),send:$('#sendRecording'),banner:$('#integrationBanner'),summary:$('#integrationSummary'),details:$('#integrationDetails'),back:$('#returnToHladvarp'),activeTitle:$('#activeSectionTitle'),sectionTime:$('#sectionCountdown'),totalTime:$('#totalCountdown'),clockStatus:$('#clockStatus'),progress:$('#totalProgress'),start:$('#startClock'),pause:$('#pauseClock'),reset:$('#resetClock'),next:$('#nextSection'),notifyBtn:$('#enableNotifications'),add:$('#addSection'),sections:$('#sectionList'),log:$('#alertLog')};
const stop=new Set('að af allt alla allir annars bara bæði eftir einnig ekki eða eins einhver eru fyrir frá hafa hefur hjá hvað hvenær hvernig í inn með mikil mjög mun nema og okkar sem sér sig sína svo til um undir upp var við það þá þar þau þeir þetta þó the and for from this that with into your about'.split(' '));const id=()=>crypto.randomUUID?crypto.randomUUID():'s-'+Date.now()+Math.random();
const trusted=u=>{try{if(!u)return'';let x=new URL(u,location.href);return [location.origin,'https://hladvarp.com'].includes(x.origin)?x.href:''}catch{return''}};const params=new URLSearchParams(location.search);const ctx={source:params.get('source')||'',episodeId:params.get('episodeId')||params.get('episode')||'',episodeTitle:params.get('episodeTitle')||params.get('title')||'',showTitle:params.get('showTitle')||params.get('show')||'',returnUrl:trusted(params.get('returnUrl')||params.get('return')),callbackUrl:trusted(params.get('callbackUrl')||params.get('uploadUrl')),uploadToken:params.get('uploadToken')||''};ctx.has=Object.values(ctx).some(Boolean);
let state={sections:[{id:id(),title:'Opnun',minutes:10,adAfter:true},{id:id(),title:'Aðalmál',minutes:20,adAfter:false},{id:id(),title:'Spurningar og lokaorð',minutes:15,adAfter:false}],active:0,running:false,timer:null,sectionLeft:null,totalLeft:null,totalStart:null,reminded:new Set(),recorder:null,chunks:[],stream:null,recordTicker:null,recordStart:0,recordPaused:0,latest:null};
const sec=m=>Math.max(0,Math.round((Number(m)||0)*60));const fmt=s=>{s=Math.max(0,Math.floor(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,a=[m,x].map(n=>String(n).padStart(2,'0')).join(':');return h?String(h).padStart(2,'0')+':'+a:a};const fmtRec=ms=>fmt(ms/1000).padStart(8,'00:');const totalSections=()=>state.sections.reduce((a,s)=>a+sec(s.minutes),0);const configured=()=>sec(e.total.value)||totalSections();const active=()=>state.sections[state.active]||state.sections[0];
function applyContext(){if(!ctx.has)return;e.summary.textContent=ctx.episodeTitle||'Nýr þáttur';e.details.textContent=[ctx.showTitle&&'Hlaðvarp: '+ctx.showTitle,ctx.episodeId&&'Þáttur ID: '+ctx.episodeId].filter(Boolean).join(' · ')||'Upptakan verður merkt tengingunni frá Hlaðvarp.com.';e.banner.hidden=false;e.send.textContent='Senda inn á Hlaðvarp';if(ctx.returnUrl){e.back.href=ctx.returnUrl;e.back.textContent='Til baka í þátt';e.back.hidden=false}}
function resetClock(render=true){state.running=false;clearInterval(state.timer);state.timer=null;state.active=0;state.sectionLeft=sec(active().minutes);state.totalStart=configured();state.totalLeft=state.totalStart;state.reminded.clear();renderClock(render)}function renderClock(renderList=false){let a=active(),sl=state.sectionLeft??sec(a.minutes),tl=state.totalLeft??configured(),ts=state.totalStart||configured();e.activeTitle.textContent=a?a.title:'Enginn kafli';e.sectionTime.textContent=fmt(sl);e.totalTime.textContent=fmt(tl);e.progress.style.width=Math.min(100,Math.max(0,(1-tl/ts)*100))+'%';e.clockStatus.textContent='Klukka: '+(state.running?'í gangi':'stopp');e.start.disabled=state.running;e.pause.disabled=!state.running;if(renderList)renderSections()}
function renderDelta(){let d=Math.round(totalSections()/60)-(Number(e.total.value)||0);e.delta.textContent=d===0?Math.round(totalSections()/60)+' mín':(d>0?'+':'')+d+' mín'}
function renderSections(){e.sections.replaceChildren(...state.sections.map((s,i)=>{let card=document.createElement('article');card.className='section'+(i===state.active?' active':'');card.dataset.id=s.id;card.innerHTML='<label>Heiti kafla<input data-field="title" value="'+esc(s.title)+'"></label><label>Mínútur<input type="number" min="1" step="1" data-field="minutes" value="'+s.minutes+'"></label><label class="ad"><input type="checkbox" data-field="adAfter" '+(s.adAfter?'checked':'')+'>Auglýsing eftir</label><button class="delete" type="button" data-action="delete" aria-label="Eyða kafla" '+(state.sections.length===1?'disabled':'')+'>×</button>';return card}));renderDelta()}function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function tick(){if(state.totalLeft<=0)return finish();state.sectionLeft--;state.totalLeft--;let a=active();if(a&&!state.reminded.has(a.id)&&sec(a.minutes)>300&&state.sectionLeft<=300&&state.sectionLeft>0){state.reminded.add(a.id);notice('5 mínútur eftir af kaflanum "'+a.title+'".','warning')}if(state.sectionLeft<=0)completeSection();renderClock()}function completeSection(){let done=active();notice('Kafla lokið: '+done.title+'.');if(done.adAfter)notice('Auglýsingar núna áður en næsti kafli hefst.','warning');if(state.active>=state.sections.length-1)return finish();state.active++;state.sectionLeft=sec(active().minutes);renderSections()}function start(){if(state.running)return;if(state.sectionLeft==null)resetClock();state.running=true;state.timer=setInterval(tick,1000);notice('Klukka byrjuð.');renderClock(true)}function pause(){state.running=false;clearInterval(state.timer);notice('Klukka sett á pásu.');renderClock()}function finish(){state.running=false;clearInterval(state.timer);state.sectionLeft=0;state.totalLeft=0;notice('Heildartíma lokið.','danger');renderClock()}
function notice(msg,t='default'){let li=document.createElement('li');li.className=t==='warning'||t==='danger'?t:'';li.textContent=new Date().toLocaleTimeString('is-IS')+' · '+msg;e.log.prepend(li);if('Notification'in window&&Notification.permission==='granted'&&t!=='default')new Notification('Hlaðvarp Studio',{body:msg})}
function analyze(){let words=Array.from(e.script.value.toLowerCase().matchAll(/[\p{L}\p{N}]{4,}/gu),m=>m[0]).filter(w=>!stop.has(w)),scores=new Map();words.forEach(w=>scores.set(w,(scores.get(w)||0)+1));for(let i=0;i<words.length-1;i++){let p=words[i]+' '+words[i+1];scores.set(p,(scores.get(p)||0)+1.5)}let top=[...scores.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'is')).slice(0,8).map(x=>x[0]);e.topics.replaceChildren(...(top.length?top:['Engin skýr málefni fundust.']).map(t=>{let c=document.createElement('span');c.className='chip';c.textContent=t;return c}))}
async function startRecording(){try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Þessi vafri styður ekki hljóðupptöku beint á vef.');e.record.disabled=true;state.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});let type=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';state.chunks=[];state.recorder=new MediaRecorder(state.stream,type?{mimeType:type}:undefined);state.recorder.ondataavailable=x=>{if(x.data.size)state.chunks.push(x.data)};state.recorder.onstop=recordingDone;state.recorder.onerror=x=>recordingError(x.error||Error('Upptaka stöðvaðist óvænt.'));state.recorder.start(1000);state.recordStart=Date.now();state.recordPaused=0;recordState('recording');document.body.classList.add('recording');state.recordTicker=setInterval(()=>e.recordTimer.textContent=fmtRec(Date.now()-state.recordStart),250)}catch(err){recordingError(err)}}function recordState(s){let rec=s==='recording',pa=s==='paused',active=rec||pa;e.recordStatus.textContent='Upptaka: '+(rec?'í gangi':pa?'pása':s==='stopping'?'vinnsla':'tilbúin');e.record.disabled=active||s==='stopping';e.pauseRecord.disabled=!active;e.stopRecord.disabled=!active;e.pauseRecord.textContent=pa?'Halda áfram':'Pása';document.body.classList.toggle('recording',rec)}function pauseRecording(){if(!state.recorder)return;if(state.recorder.state==='recording'){state.recorder.pause();state.recordPaused=Date.now()-state.recordStart;clearInterval(state.recordTicker);recordState('paused')}else if(state.recorder.state==='paused'){state.recorder.resume();state.recordStart=Date.now()-state.recordPaused;state.recordTicker=setInterval(()=>e.recordTimer.textContent=fmtRec(Date.now()-state.recordStart),250);recordState('recording')}}function stopRecording(){if(state.recorder&&state.recorder.state!=='inactive'){state.recorder.stop();recordState('stopping')}}function recordingDone(){let type=state.recorder.mimeType||'audio/webm',blob=new Blob(state.chunks,{type}),ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm',name=fileStem()+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext;state.stream?.getTracks().forEach(t=>t.stop());clearInterval(state.recordTicker);document.body.classList.remove('recording');state.latest={blob,mimeType:type,fileName:name};let url=URL.createObjectURL(blob);e.playback.src=url;e.playback.hidden=false;e.download.href=url;e.download.download=name;e.download.hidden=false;e.send.hidden=false;e.send.disabled=false;e.record.disabled=false;e.pauseRecord.disabled=true;e.stopRecord.disabled=true;e.recordStatus.textContent='Upptaka: vistuð í vafra';notice('Upptaka tilbúin til hlustunar, sendingar og niðurhals.')}function recordingError(err){clearInterval(state.recordTicker);document.body.classList.remove('recording');e.record.disabled=false;e.pauseRecord.disabled=true;e.stopRecord.disabled=true;e.recordStatus.textContent='Upptaka: villa';notice(err.message||'Ekki tókst að ræsa upptöku.','danger')}function fileStem(){let src=ctx.episodeId||[ctx.showTitle,ctx.episodeTitle].filter(Boolean).join('-'),clean=src.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);return clean?'hladvarp-'+clean:'podcast-upptaka'}
async function sendRecording(){if(!state.latest)return notice('Engin upptaka er tilbúin til sendingar.','warning');let endpoint=ctx.callbackUrl||'/api/recordings',url=new URL(endpoint,location.href),headers={'Content-Type':state.latest.mimeType,'X-Recording-Name':encodeURIComponent(state.latest.fileName),'X-Hladvarp-Tool':'podcast-studio-recorder','X-Episode-Id':encodeURIComponent(ctx.episodeId),'X-Episode-Title':encodeURIComponent(ctx.episodeTitle),'X-Show-Title':encodeURIComponent(ctx.showTitle)};if(ctx.uploadToken){headers.Authorization='Bearer '+ctx.uploadToken;headers['X-Upload-Token']=ctx.uploadToken}e.send.disabled=true;e.recordStatus.textContent=ctx.has?'Upptaka: sendi á Hlaðvarp':'Upptaka: sendi inn';try{let r=await fetch(endpoint,{method:'POST',credentials:url.origin===location.origin?'same-origin':'include',headers,body:state.latest.blob});if(!r.ok)throw Error('Server svaraði með villu '+r.status+'.');let result=await r.json();e.recordStatus.textContent=ctx.has?'Upptaka: send á Hlaðvarp':'Upptaka: send inn';notice('Upptaka send '+(ctx.has?'Hlaðvarp':'inn')+' og vistuð sem '+result.fileName+'.');if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'hladvarp-recording-ready',episodeId:ctx.episodeId,episodeTitle:ctx.episodeTitle,showTitle:ctx.showTitle,recording:result},ctx.returnUrl?new URL(ctx.returnUrl).origin:location.origin)}}catch(err){e.recordStatus.textContent='Upptaka: sending mistókst';notice((err.message||'Sending mistókst.')+' Athugaðu að tengingin við Hlaðvarp eða server.py sé virk.','danger')}finally{e.send.disabled=false}}
function bind(){e.total.onchange=()=>resetClock();e.total.oninput=renderDelta;$('#analyzeTopics').onclick=analyze;e.add.onclick=()=>{state.sections.push({id:id(),title:'Kafli '+(state.sections.length+1),minutes:10,adAfter:false});resetClock()};e.start.onclick=start;e.pause.onclick=pause;e.reset.onclick=()=>{resetClock();notice('Klukka endurstillt.')};e.next.onclick=()=>{if(state.active>=state.sections.length-1)return finish();state.active++;state.sectionLeft=sec(active().minutes);notice('Fært í kafla: '+active().title+'.');renderClock(true)};e.notifyBtn.onclick=async()=>{'Notification'in window?notice((await Notification.requestPermission())==='granted'?'Tilkynningar virkjaðar.':'Tilkynningar verða áfram inni í appinu.','warning'):notice('Þessi vafri styður ekki kerfistilkynningar.','warning')};e.record.onclick=startRecording;e.pauseRecord.onclick=pauseRecording;e.stopRecord.onclick=stopRecording;e.send.onclick=sendRecording;e.sections.oninput=x=>{let card=x.target.closest('.section'),s=state.sections.find(v=>v.id===card.dataset.id),f=x.target.dataset.field;if(!s||!f)return;if(f==='minutes')s.minutes=Math.max(1,Number(x.target.value)||1);else if(f==='adAfter')s.adAfter=x.target.checked;else s.title=x.target.value.trim()||'Ónefndur kafli';if(!state.running){state.sectionLeft=sec(active().minutes);state.totalStart=configured();state.totalLeft=state.totalStart;renderClock();renderDelta()}};e.sections.onclick=x=>{let b=x.target.closest('[data-action="delete"]'),card=x.target.closest('.section');if(b&&card&&state.sections.length>1){state.sections=state.sections.filter(s=>s.id!==card.dataset.id);state.active=Math.min(state.active,state.sections.length-1);resetClock()}}}
bind();applyContext();resetClock();analyze();if(!('Notification'in window))e.notifyBtn.disabled=true;
</script>
</body>
</html>
